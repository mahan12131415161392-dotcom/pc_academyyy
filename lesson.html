let currentCourse = 0;
let completed = [];

try {
 completed = JSON.parse(localStorage.getItem("pcAcademyCompleted") || "[]");
 if(!Array.isArray(completed)) completed=[];
} catch(e) {
 completed=[];
}

function faNumber(number){
 return String(number).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function renderHome(){
 const grid=document.getElementById("courseGrid");
 grid.innerHTML="";

 courses.forEach((course,index)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   <h3>${course.emoji} ${course.title}</h3>
   <p>${course.description}</p>
   <p>${completed.includes(index)?"✅ تکمیل شده":"📘 شروع یادگیری"}</p>
   <button onclick="openCourse(${index})">باز کردن درس</button>
  `;
  grid.appendChild(card);
 });
 updateProgress();
}

function updateProgress(){
 const count=completed.length;
 document.getElementById("progressText").textContent=
 faNumber(count)+" از ۷ درس تکمیل شده";
 document.getElementById("progressFill").style.width=
 (count/7*100)+"%";
}

function showHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("lessonView").classList.add("hidden");
 history.replaceState(null,"",location.pathname+location.search);
 renderHome();
 window.scrollTo(0,0);
}

function openCourse(index){
 if(index<0 || index>=courses.length) return;
 currentCourse=index;

 history.replaceState(null,"","#lesson"+(index+1));

 const course=courses[index];
 document.getElementById("home").classList.add("hidden");
 document.getElementById("lessonView").classList.remove("hidden");
 document.getElementById("lessonTitle").textContent=
 course.emoji+" "+course.title;
 document.getElementById("lessonContent").innerHTML=course.content;

 document.getElementById("quizResult").textContent="";
 renderQuiz();

 document.getElementById("prevBtn").disabled=index===0;
 document.getElementById("nextBtn").disabled=index===courses.length-1;

 window.scrollTo(0,0);
}

function renderQuiz(){
 const course=courses[currentCourse];
 const area=document.getElementById("quizQuestions");
 area.innerHTML="";

 course.quiz.forEach((q,qi)=>{
  const div=document.createElement("div");
  div.className="question";
  div.innerHTML=`<strong>${faNumber(qi+1)}. ${q[0]}</strong>`;

  q[1].forEach((option,oi)=>{
   const btn=document.createElement("button");
   btn.className="option";
   btn.textContent=option;
   btn.dataset.question=qi;
   btn.dataset.option=oi;
   btn.onclick=()=>{
    div.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    btn.dataset.selected="true";
   };
   div.appendChild(btn);
  });
  area.appendChild(div);
 });
}

function checkQuiz(){
 const course=courses[currentCourse];
 const questions=document.querySelectorAll(".question");
 let correct=0;
 let answered=0;

 questions.forEach((div,qi)=>{
  const selected=div.querySelector('[data-selected="true"]');
  const buttons=div.querySelectorAll(".option");

  buttons.forEach(btn=>{
   btn.classList.remove("correct","wrong");
   btn.disabled=true;
  });

  if(selected){
   answered++;
   const chosen=Number(selected.dataset.option);
   const right=course.quiz[qi][2];

   if(chosen===right){
    correct++;
    selected.classList.add("correct");
   }else{
    selected.classList.add("wrong");
    buttons[right].classList.add("correct");
   }
  }else{
   buttons[course.quiz[qi][2]].classList.add("correct");
  }
 });

 const result=document.getElementById("quizResult");

 if(answered<course.quiz.length){
  result.textContent="به "+faNumber(correct)+" سؤال از "+faNumber(course.quiz.length)+" سؤال پاسخ درست دادی. پاسخ‌های درست با رنگ سبز مشخص شده‌اند.";
 }else{
  result.textContent="نتیجه: "+faNumber(correct)+" از "+faNumber(course.quiz.length)+" پاسخ درست";

  if(correct===course.quiz.length){
   if(!completed.includes(currentCourse)){
    completed.push(currentCourse);
    try{
     localStorage.setItem("pcAcademyCompleted",JSON.stringify(completed));
    }catch(e){}
   }
   result.textContent+=" 🎉 درس با موفقیت تکمیل شد!";
  }else{
   result.textContent+=" برای تکمیل درس، دوباره آموزش را مرور کن.";
  }
 }
 updateProgress();
}

function nextCourse(){
 if(currentCourse<courses.length-1){
  openCourse(currentCourse+1);
 }
}

function previousCourse(){
 if(currentCourse>0){
  openCourse(currentCourse-1);
 }
}

renderHome();

const match=location.hash.match(/^#lesson([1-7])$/);
if(match){
 openCourse(Number(match[1])-1);
}else{
 showHome();
}
</script>
